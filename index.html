<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>سيستم بحر — النظام المالي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      max-width: 400px;
      width: 100%;
    }
    .logo-badge {
      width: 65px;
      height: 65px;
      background: #0284c7;
      color: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 18px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    h2 { margin: 0 0 8px; font-size: 24px; color: #38bdf8; }
    p { margin: 0 0 20px; color: #94a3b8; font-size: 15px; }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #334155;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn {
      display: none;
      margin-top: 15px;
      padding: 12px 20px;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">🌊</div>
    <h2>سيستم بحر</h2>
    <p id="msg">جاري الاتصال بكمبيوتر المحل والتحويل التلقائي...</p>
    <div class="spinner" id="loader"></div>
    <div id="status"></div>
    <a href="#" id="direct-btn" class="btn">اضغط هنا للدخول المباشر</a>
  </div>

  <script>
    fetch('https://ntfy.sh/bahr_system_khalid_9988/json?poll=1')
      .then(res => res.text())
      .then(text => {
        const lines = text.trim().split('\n');
        const last = JSON.parse(lines[lines.length - 1]);
        if (last && last.message && last.message.startsWith('http')) {
          document.getElementById('msg').innerText = 'تم الاتصال بنجاح! جاري فتح السيستم...';
          document.getElementById('direct-btn').href = last.message;
          document.getElementById('direct-btn').style.display = 'inline-block';
          window.location.replace(last.message);
        } else {
          showError('السيستم غير متصل حالياً، يرجى تشغيله من كمبيوتر المحل.');
        }
      })
      .catch(err => {
        showError('تعذر الاتصال، يرجى التأكد من تشغيل كمبيوتر المحل واتصاله بالإنترنت.');
      });

    function showError(text) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('msg').innerText = 'تنبيه';
      document.getElementById('status').innerHTML = '<p style="color: #f87171; font-weight: bold;">' + text + '</p>';
    }
  </script>
</body>
</html>
